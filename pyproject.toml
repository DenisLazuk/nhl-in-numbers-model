[project]
name = "nhl-in-numbers-model"
version = "0.1.0"
description = "НХЛ в цифрах — прогноз победителя матча НХЛ"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["scripts", "tests"]
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = [
  "E402", # CLI: sys.path, then local imports
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"
